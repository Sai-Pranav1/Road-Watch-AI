<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>RoadGuard AI | Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased flex items-center justify-center p-4">
  <form id="loginForm" class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-7 shadow-2xl space-y-4">
    <div>
      <h1 class="text-lg font-bold text-white">RoadGuard Command Center</h1>
      <p class="text-xs text-slate-400 mt-1">Authorized personnel only. Enter the admin password.</p>
    </div>
    <input type="password" id="pw" required autofocus autocomplete="current-password" placeholder="Admin password"
      class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500" />
    <p id="err" class="hidden text-xs text-red-400"></p>
    <button type="submit" id="btn" class="w-full py-2.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 disabled:opacity-60 text-white text-sm font-semibold transition">Sign in</button>
  </form>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn"), err = document.getElementById("err");
      btn.disabled = true; err.classList.add("hidden");
      try {
        const res = await fetch("/api/v1/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.getElementById("pw").value })
        });
        if (res.ok) { window.location.href = "/admin"; return; }
        const data = await res.json().catch(() => ({}));
        err.textContent = data.detail || "Login failed";
      } catch (_) {
        err.textContent = "Network error. Please try again.";
      }
      err.classList.remove("hidden");
      btn.disabled = false;
    });
  </script>
</body>
</html>
